name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ainative
          POSTGRES_PASSWORD: ainative
          POSTGRES_DB: ainative_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ainative -d ainative_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://ainative:ainative@localhost:5433/ainative_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `--deny-warnings` makes oxlint exit non-zero on any warning, so a
      # green lint step really means "no findings".
      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: API e2e tests
        run: pnpm --filter api test:e2e

      - name: Build
        run: pnpm build
