name: ai-native

services:
  postgres:
    image: postgres:17-alpine
    container_name: ai-native-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ainative}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ainative}
      POSTGRES_DB: ${POSTGRES_DB:-ainative}
    ports:
      # 5433 on the host: a locally installed PostgreSQL usually owns 5432.
      # Override with POSTGRES_PORT when that port is free.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Named volume: the data survives `docker compose down` (only `down -v` clears it).
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ainative} -d ${POSTGRES_DB:-ainative}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
